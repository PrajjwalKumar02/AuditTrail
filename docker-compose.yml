version: '3.8'

services:
  #  MongoDB Service 
  mongodb:
    image: mongo:6.0
    container_name: audit-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: auditrail
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - audit-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  #  MongoDB Express (Admin UI) 
  mongo-express:
    image: mongo-express:latest
    container_name: audit-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - audit-network

  #  Backend API Service 
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audit-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://admin:admin123@mongodb:27017/auditrail?authSource=admin
      - JWT_SECRET=dev_secret_key_change_in_production
      - JWT_EXPIRE=7d
      - CORS_ORIGIN=http://localhost:5173
      - LOG_LEVEL=debug
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - audit-network
    command: npm run dev

  #  Frontend Service 
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: audit-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_WS_URL=ws://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - audit-network
    command: npm run dev -- --host

# ========== Networks ==========
networks:
  audit-network:
    driver: bridge

# ========== Volumes ==========
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
